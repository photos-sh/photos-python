[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photos-sh"
dynamic = ["version"]
description = "Python client for the Photos.sh image API: background removal, resizing, upscaling, text removal, marketplace checks, barcodes and labels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vallic" }]
requires-python = ">=3.9"
keywords = ["photos.sh", "image", "background removal", "upscale", "ocr", "barcode", "api client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://photos.sh"
Repository = "https://github.com/photos-sh/photos-python"
Changelog = "https://github.com/photos-sh/photos-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.hatch.version]
path = "src/photos_sh/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/photos_sh"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PT"]
# Optional[X] and Union[X, Y] stay: on Python 3.9, `X | None` cannot be evaluated at run time.
ignore = ["UP007", "UP045"]

[tool.mypy]
strict = true
files = ["src", "tests"]
